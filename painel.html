<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel da Barbearia - Gestão de Agendamentos</title>
    <link rel="icon" href="fotos/logo.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest-painel.json" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="tema.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:"#E5303F",dark:"#B71C2B"},azul:"#2F6FD0"}}}}</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 min-h-dvh">
    <!-- Mesmo fundo do site do cliente (versão discreta) -->
    <div id="fundo" class="calmo fixed inset-0 -z-10"><div class="img"></div><div class="ferr"></div><div class="veu"></div></div>
    <!-- Logo (emblema) definida uma vez e reutilizada com <use href="#emblema"> -->
    <svg width="0" height="0" class="absolute" aria-hidden="true"><symbol id="emblema" viewBox="0 0 240 240">
        <defs>
          <pattern id="em-lis" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="10" height="3.4" fill="#d62839"/><rect y="3.4" width="10" height="3.3" fill="#fff"/><rect y="6.7" width="10" height="3.3" fill="#2F6FD0"/></pattern>
          <linearGradient id="em-faixa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3a3aa"/><stop offset=".5" stop-color="#70707a"/><stop offset="1" stop-color="#55555d"/></linearGradient>
          <path id="em-cima" d="M 48 120 A 72 72 0 0 1 192 120"/>
          <path id="em-baixo" d="M 32 120 A 88 88 0 0 0 208 120"/>
        </defs>
        <circle cx="120" cy="120" r="117" fill="#0b0b0d" stroke="#fff" stroke-width="2.5"/>
        <circle cx="120" cy="120" r="108" fill="none" stroke="#fff" stroke-opacity=".25"/>
        <rect x="110" y="3" width="20" height="26" rx="4" fill="url(#em-lis)" stroke="#e4e4e7" stroke-width="1.6"/><rect x="107" y="1" width="26" height="5" rx="2.5" fill="#cfcfd4"/>
        <rect x="110" y="214" width="20" height="23" rx="4" fill="url(#em-lis)" stroke="#e4e4e7" stroke-width="1.6"/><rect x="107" y="234" width="26" height="5" rx="2.5" fill="#cfcfd4"/>
        <text font-family="Oswald,Arial,sans-serif" font-size="15" font-weight="500" letter-spacing="5" fill="#fff"><textPath href="#em-cima" startOffset="50%" text-anchor="middle">BARBEARIA</textPath></text>
        <text font-family="Oswald,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="4.5" fill="#fff"><textPath href="#em-baixo" startOffset="50%" text-anchor="middle">TRADICIONAL</textPath></text>
        <g transform="translate(120 72)" stroke="#fff" fill="none" stroke-width="1.7" stroke-linecap="round"><circle cx="-6" cy="7" r="3.6"/><circle cx="6" cy="7" r="3.6"/><path d="M-4 4 L5 -9 M4 4 L-5 -9"/></g>
        <path d="M12 100 L42 100 L42 146 L12 146 L23 123 Z" fill="#45454c"/><path d="M228 100 L198 100 L198 146 L228 146 L217 123 Z" fill="#45454c"/>
        <rect x="34" y="92" width="172" height="48" fill="url(#em-faixa)"/><rect x="34" y="92" width="172" height="2" fill="#fff" opacity=".35"/>
        <text x="120" y="127" text-anchor="middle" font-family="Oswald,Arial,sans-serif" fill="#fff"><tspan font-size="15" font-weight="500" letter-spacing="3">MEGA </tspan><tspan font-size="31" font-weight="700" letter-spacing="1">BARBA</tspan></text>
        <path d="M120 162 C128 155 138 153 146 157 C152 160 158 159 164 153 C164 165 154 173 142 171 C134 170 127 166 120 162 Z M120 162 C112 155 102 153 94 157 C88 160 82 159 76 153 C76 165 86 173 98 171 C106 170 113 166 120 162 Z" fill="#fff"/>
      </symbol></svg>

    <!-- LOGIN -->
    <div id="tela-login" class="min-h-dvh flex items-center justify-center p-4">
      <div class="glass p-6 rounded-2xl max-w-sm w-full space-y-4 text-center shadow-xl">
        <svg class="w-24 h-24 mx-auto" role="img" aria-label="Mega Barba"><use href="#emblema"/></svg>
        <p class="font-display font-bold tracking-[.12em] text-xl">MEGA BARBA</p>
        <h1 class="text-sm font-semibold text-zinc-300 tracking-wider">PAINEL INTERNO</h1>
        <p class="text-xs text-zinc-400">Digite seu PIN para acessar a agenda</p>
        <input type="password" id="pin-acesso" inputmode="numeric" autocomplete="off" placeholder="PIN" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-center text-lg tracking-widest text-brand focus:outline-none focus:border-brand" />
        <p id="erro-login" class="hidden text-sm text-red-400"></p>
        <button type="button" id="btn-entrar" onclick="autenticar()" class="w-full btn-gold disabled:opacity-50 text-zinc-950 font-bold py-3 rounded-lg transition uppercase text-sm cursor-pointer">Entrar no Sistema</button>
      </div>
    </div>

    <!-- PAINEL -->
    <div id="painel-principal" class="hidden min-h-dvh flex flex-col">
      <header class="glass sticky top-0 z-20 p-4 flex justify-between items-center rounded-none border-x-0 border-t-0">
        <div>
          <h2 class="font-bold text-brand text-lg" id="nome-usuario-logado">Painel</h2>
          <p class="text-xs text-zinc-400" id="perfil-usuario-logado">Acesso</p>
        </div>
        <button type="button" onclick="sair()" class="text-sm bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2.5 rounded-lg cursor-pointer">Sair</button>
      </header>

      <main class="p-4 max-w-4xl mx-auto w-full space-y-6 flex-1">
        <!-- TURNO (barbeiro) -->
        <section id="secao-configuracao-turno" class="glass p-4 rounded-2xl space-y-3">
          <h3 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Meus horários de trabalho</h3>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
            <div><label class="block text-zinc-400 mb-1">Início turno</label><input type="time" id="turno-inicio" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-base text-zinc-100" /></div>
            <div><label class="block text-zinc-400 mb-1">Fim turno</label><input type="time" id="turno-fim" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-base text-zinc-100" /></div>
            <div><label class="block text-zinc-400 mb-1">Início almoço</label><input type="time" id="almoco-inicio" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-base text-zinc-100" /></div>
            <div><label class="block text-zinc-400 mb-1">Fim almoço</label><input type="time" id="almoco-fim" class="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-base text-zinc-100" /></div>
          </div>
          <button type="button" onclick="salvarConfiguracaoTurno()" class="bg-brand/10 text-brand border border-brand/30 hover:bg-brand/20 text-sm font-medium py-2.5 px-4 rounded-lg transition cursor-pointer">Salvar meus horários</button>
          <p id="msg-turno" class="hidden text-xs"></p>
        </section>

        <!-- INDICADORES (caixa do dia) -->
        <section class="grid grid-cols-2 lg:grid-cols-4 gap-3">
          <div class="glass rounded-2xl p-4"><p class="kpi-l">Realizado</p><p class="kpi-v text-green-400" id="kpi-real">R$ 0</p></div>
          <div class="glass rounded-2xl p-4"><p class="kpi-l">A receber</p><p class="kpi-v text-brand" id="kpi-prev">R$ 0</p></div>
          <div class="glass rounded-2xl p-4"><p class="kpi-l">Atendimentos</p><p class="kpi-v" id="kpi-qtd">0</p></div>
          <div class="glass rounded-2xl p-4"><p class="kpi-l">Próximo</p><p class="kpi-v text-lg truncate" id="kpi-prox">—</p></div>
        </section>

        <!-- FILTRO + DATA -->
        <div class="glass p-3 rounded-2xl flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <button type="button" onclick="mudarDia(-1)" class="bg-zinc-950 border border-zinc-800 rounded-lg w-10 h-10 cursor-pointer" aria-label="Dia anterior">‹</button>
            <input type="date" id="data-agenda" onchange="renderizarAgenda()" class="bg-zinc-950 border border-zinc-800 text-zinc-100 text-base rounded-lg p-2" />
            <button type="button" onclick="mudarDia(1)" class="bg-zinc-950 border border-zinc-800 rounded-lg w-10 h-10 cursor-pointer" aria-label="Próximo dia">›</button>
          </div>
          <div id="seletor-dono" class="hidden flex items-center gap-2">
            <span class="text-xs text-zinc-400">Agenda de:</span>
            <select id="select-barbeiro-dono" onchange="renderizarAgenda()" class="bg-zinc-950 border border-zinc-800 text-brand text-sm font-bold rounded-lg p-2 focus:outline-none">
              <option value="TODOS">Todos os barbeiros</option>
            </select>
          </div>
        </div>

        <!-- FOLGA / FERIADO (dia inteiro) -->
        <div id="faixa-folga" class="hidden glass rounded-2xl p-3 flex items-center justify-between gap-3">
          <p id="folga-txt" class="text-sm text-zinc-300"></p>
          <button type="button" id="btn-folga" onclick="alternarFolga()" class="shrink-0 text-xs min-h-10 px-3 rounded-xl border border-white/10 text-zinc-200 hover:border-brand cursor-pointer"></button>
        </div>

        <!-- AGENDA -->
        <section class="glass p-4 rounded-2xl space-y-4">
          <div class="flex justify-between items-center gap-2">
            <h3 class="text-sm font-semibold text-zinc-300 uppercase tracking-wider">Agenda de atendimentos</h3>
            <span class="chip" id="resumo-faturamento">Carregando...</span>
          </div>
          <div id="container-agenda" class="space-y-2"></div>
        </section>
      </main>
    </div>

    <script>
      // ====== CONFIGURAÇÃO (Supabase > Project Settings > API) ======
      const SUPABASE_URL = "https://zutigpmlqstffoktmxfa.supabase.co";
      const SUPABASE_KEY = "sb_publishable_-B8ShszTtEQ1Zj3IiLulKQ_CtgJvWve";
      const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const HORAS = Array.from({ length: 21 }, (_, i) => { const m = 540 + i * 30; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + (m % 60 ? "30" : "00"); });
      let usuario = null, pin = null, equipe = [], emFolga = false;
      const SKEL = Array(5).fill('<div class="skel h-14 rounded-2xl"></div>').join("");

      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const min = (h) => { const [a, b] = h.split(":"); return Number(a) * 60 + Number(b); };
      const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

      $("pin-acesso").addEventListener("keydown", (e) => { if (e.key === "Enter") autenticar(); });

      async function autenticar() {
        const digitado = $("pin-acesso").value.trim();
        const erro = $("erro-login"), btn = $("btn-entrar");
        erro.classList.add("hidden");
        if (!digitado) return;
        btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Entrando...';
        const { data, error } = await db.rpc("painel_login", { p_pin: digitado });
        btn.disabled = false; btn.textContent = "Entrar no Sistema";
        if (error || !data) { erro.textContent = error ? "Erro de conexão: " + error.message : "PIN inválido."; erro.classList.remove("hidden"); return; }

        usuario = data; pin = digitado;
        await carregarEquipe();
        $("tela-login").classList.add("hidden");
        $("painel-principal").classList.remove("hidden");
        $("nome-usuario-logado").textContent = usuario.nome;
        const dono = usuario.papel === "DONO";
        $("perfil-usuario-logado").textContent = dono ? "Acesso Master (Dono)" : "Painel do Barbeiro";
        $("secao-configuracao-turno").classList.toggle("hidden", dono);
        $("seletor-dono").classList.toggle("hidden", !dono);
        if (dono) {
          $("select-barbeiro-dono").innerHTML = '<option value="TODOS">Todos os barbeiros</option>' +
            equipe.map((b) => `<option value="${esc(b.id)}">${esc(b.nome)}</option>`).join("");
        } else {
          preencherTurno();
        }
        $("data-agenda").value = iso(new Date());
        renderizarAgenda();
      }

      async function carregarEquipe() {
        const { data } = await db.rpc("listar_barbeiros");
        equipe = data || [];
      }

      function preencherTurno() {
        const eu = equipe.find((b) => b.id === usuario.id);
        if (!eu) return;
        $("turno-inicio").value = eu.turno_inicio; $("turno-fim").value = eu.turno_fim;
        $("almoco-inicio").value = eu.almoco_inicio; $("almoco-fim").value = eu.almoco_fim;
      }

      function mudarDia(delta) {
        const d = new Date($("data-agenda").value + "T00:00");
        d.setDate(d.getDate() + delta);
        $("data-agenda").value = iso(d);
        renderizarAgenda();
      }

      async function renderizarAgenda() {
        const container = $("container-agenda");
        const dia = $("data-agenda").value;
        if (!dia) return;
        if (!container.children.length) container.innerHTML = SKEL;   // loading só na 1ª carga (sem piscar a cada atualização)
        const [r, fd] = await Promise.all([
          db.rpc("painel_agenda", { p_pin: pin, p_data: dia }),
          usuario.papel === "BARBEIRO" ? db.rpc("painel_folga_dia", { p_pin: pin, p_data: dia }) : Promise.resolve({ data: null }),
        ]);
        const ags = r.data, error = r.error;
        emFolga = !!(fd.data && fd.data.folga);
        atualizarFaixaFolga(fd.data);
        if (error) { container.innerHTML = '<p class="text-sm text-red-400">Erro ao carregar a agenda.</p>'; return; }
        if (emFolga) {
          container.innerHTML = '<div class="rounded-2xl border border-brand/30 bg-brand/5 p-6 text-center text-sm text-zinc-300">Dia de folga: nenhum horário fica disponível para os clientes.</div>';
          ["kpi-real", "kpi-prev"].forEach((i) => ($(i).textContent = "R$ 0"));
          $("kpi-qtd").textContent = "0"; $("kpi-prox").textContent = "—";
          return;
        }

        const dono = usuario.papel === "DONO";
        const filtro = dono ? $("select-barbeiro-dono").value : usuario.id;
        const lista = filtro === "TODOS" ? ags : ags.filter((a) => a.barbeiro_id === filtro);
        const conf = filtro === "TODOS" ? null : equipe.find((b) => b.id === filtro);

        const agora = new Date(), hojeSel = dia === iso(agora), nm = agora.getHours() * 60 + agora.getMinutes();
        let real = 0, previsto = 0, html = "";
        HORAS.forEach((h) => {
          const m = min(h);
          const agoraCls = hojeSel && nm >= m && nm < m + 30 ? "ring-1 ring-brand/70" : "";  // marca o horário atual
          if (conf && (m < min(conf.turno_inicio) || m >= min(conf.turno_fim))) return;
          const itens = lista.filter((a) => a.hora === h);
          const emAtendimento = lista.some((a) => min(a.hora) < m && min(a.hora) + a.duracao > m);
          const almoco = conf && m >= min(conf.almoco_inicio) && m < min(conf.almoco_fim);
          let corpo = "";

          itens.forEach((a) => {
            const bloq = a.status === "BLOQUEADO", ok = a.status === "CONCLUIDO";
            if (ok) real += Number(a.valor); else if (a.status === "CONFIRMADO") previsto += Number(a.valor);
            const btnOk = a.status === "CONFIRMADO" ? `<button type="button" onclick="concluir('${esc(a.id)}')" class="text-xs min-h-10 bg-green-500/10 text-green-400 border border-green-500/20 hover:bg-green-500/20 px-3 rounded cursor-pointer">Concluir</button>` : "";
            corpo += `<div class="flex items-center justify-between gap-2">
              <div>
                <p class="font-medium text-sm ${bloq ? "text-zinc-500 italic" : "text-zinc-100"}">${ok ? '<span class="chip mr-1">Concluído</span>' : ""}${esc(a.cliente_nome)} ${dono ? `<span class="text-xs text-brand/80">(${esc(a.barbeiro)})</span>` : ""}</p>
                <p class="text-xs text-zinc-400">${esc(a.servico)} • ${a.duracao} min${a.valor > 0 ? ` • R$ ${Number(a.valor)}` : ""}${a.brinde ? " • Brinde" : ""}</p>
              </div>
              <div class="flex gap-2">${btnOk}<button type="button" onclick="cancelar('${esc(a.id)}')" class="text-xs min-h-10 bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 px-3 rounded cursor-pointer">${bloq ? "Desbloquear" : "Cancelar"}</button></div>
            </div>`;
          });
          if (!itens.length) {
            if (emAtendimento) corpo = '<span class="text-xs text-zinc-600">↳ em atendimento</span>';
            else if (almoco) corpo = '<span class="text-xs text-zinc-500">Almoço</span>';
            else corpo = `<div class="flex items-center justify-between gap-2"><span class="text-xs text-zinc-500">Livre</span>${
              dono ? "" : `<button type="button" onclick="bloquear('${h}')" class="text-xs min-h-10 glass hover:border-red-500 hover:text-red-400 text-zinc-400 px-3 rounded transition cursor-pointer">Bloquear 30 min</button>`
            }</div>`;
          }
          html += `<div class="glass rounded-2xl p-3 flex gap-3 ${agoraCls}"><span class="font-bold text-brand text-sm w-12 pt-2">${h}</span><div class="flex-1 space-y-2">${corpo}</div></div>`;
        });

        container.innerHTML = html || '<p class="text-sm text-zinc-500">Sem horários neste turno.</p>';
        const ativos = lista.filter((a) => a.status !== "BLOQUEADO");
        const prox = lista.find((a) => a.status === "CONFIRMADO" && (!hojeSel || min(a.hora) + a.duracao > nm));
        $("kpi-real").textContent = `R$ ${real}`;
        $("kpi-prev").textContent = `R$ ${previsto}`;
        $("kpi-qtd").textContent = ativos.length;
        $("kpi-prox").textContent = prox ? `${prox.hora} • ${prox.cliente_nome.split(" ")[0]}` : "—";
        $("resumo-faturamento").textContent = "● Ao vivo • " + agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      }

      async function acao(fn, args) {
        const { error } = await db.rpc(fn, { p_pin: pin, ...args });
        if (error) alert("Não foi possível concluir: " + error.message);
        renderizarAgenda();
      }
      const concluir = (id) => acao("painel_concluir", { p_id: id });
      // ---- Folga / feriado: bloqueia o dia inteiro para os clientes ----
      function atualizarFaixaFolga(d) {
        const f = $("faixa-folga");
        if (usuario.papel !== "BARBEIRO") { f.classList.add("hidden"); return; }
        f.classList.remove("hidden");
        $("folga-txt").textContent = d && d.folga ? `Dia de folga${d.motivo ? " — " + d.motivo : ""}` : "Vai se ausentar neste dia?";
        $("btn-folga").textContent = d && d.folga ? "Remover folga" : "Marcar dia de folga";
      }
      async function alternarFolga() {
        let motivo = "";
        if (!emFolga) { motivo = prompt("Motivo da folga (opcional). Ex.: feriado, consulta"); if (motivo === null) return; }
        await acao("painel_folga", { p_data: $("data-agenda").value, p_ativar: !emFolga, p_motivo: motivo });
      }

      const bloquear = (h) => acao("painel_bloquear", { p_data: $("data-agenda").value, p_hora: h });
      const cancelar = (id) => {
        if (confirm("Remover este item da agenda?")) acao("painel_cancelar", { p_id: id });
      };

      async function salvarConfiguracaoTurno() {
        const [ti, tf, ai, af] = ["turno-inicio", "turno-fim", "almoco-inicio", "almoco-fim"].map((id) => $(id).value);
        const msg = $("msg-turno");
        msg.classList.remove("hidden");
        if (!ti || !tf || !ai || !af || min(ti) >= min(tf) || min(ai) >= min(af) || min(ai) < min(ti) || min(af) > min(tf)) {
          msg.className = "text-xs text-red-400";
          msg.textContent = "Confira os horários: o almoço precisa estar dentro do turno.";
          return;
        }
        const { error } = await db.rpc("painel_salvar_turno", { p_pin: pin, p_ti: ti, p_tf: tf, p_ai: ai, p_af: af });
        if (error) { msg.className = "text-xs text-red-400"; msg.textContent = "Erro ao salvar."; return; }
        await carregarEquipe();
        msg.className = "text-xs text-green-400";
        msg.textContent = "Horários salvos! Já valem no app do cliente.";
        renderizarAgenda();
      }

      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

      // Atualização automática a cada 30s (agenda "em tempo real")
      setInterval(() => { if (usuario && !document.hidden) renderizarAgenda(); }, 30000);

      function sair() { pin = null; usuario = null; location.reload(); }
    </script>
  </body>
</html>
